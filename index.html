<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>CinéScan Terminal Pro</title>
    <link rel="manifest" href="manifest.json">
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/html5-qrcode"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@700;900&display=swap');
        
        body { background: #000; color: #fff; font-family: ui-sans-serif, system-ui; height: 100vh; overflow: hidden; display: flex; flex-direction: column; }
        .font-cinema { font-family: 'Barlow Condensed', sans-serif; }

        /* Scanner Styling */
        #reader video { object-fit: cover !important; }
        #reader__dashboard { display: none !important; }
        
        /* Laser Animation */
        .laser-line {
            position: absolute; width: 100%; height: 2px; background: #ff0000;
            box-shadow: 0 0 10px #ff0000; z-index: 50; animation: scanMove 2s infinite alternate;
        }
        @keyframes scanMove { from { top: 0% } to { top: 100% } }

        .status-drawer { transition: transform 0.4s cubic-bezier(0.4, 0, 0.2, 1); }
    </style>
</head>
<body class="bg-black text-white">

    <header class="p-4 bg-zinc-900 border-b border-white/10 flex justify-between items-center">
        <div>
            <h1 class="font-cinema text-2xl tracking-tighter leading-none">TERMINAL <span class="text-red-600">KDV-8</span></h1>
            <p class="text-[9px] font-bold opacity-40 uppercase tracking-widest">Contrôle Accès VIP</p>
        </div>
        <div class="bg-black/40 px-3 py-1 rounded border border-white/5 text-right">
            <p class="text-[8px] opacity-50 uppercase">Entrées</p>
            <p id="counter" class="text-xs font-bold text-red-500">0</p>
        </div>
    </header>

    <main class="flex-1 relative bg-black flex items-center justify-center">
        <div class="relative w-64 h-64 border-2 border-white/10 rounded-2xl overflow-hidden shadow-2xl">
            <div class="laser-line"></div>
            <div id="reader" class="w-full h-full"></div>
        </div>
        <div class="absolute inset-0 pointer-events-none border-[20px] border-black/60"></div>
    </main>

    <section class="h-44 bg-zinc-950 p-4 border-t border-white/10 overflow-hidden flex flex-col">
        <h2 class="text-[8px] font-black text-zinc-600 uppercase tracking-[0.3em] mb-2">Logs Terminal</h2>
        <div id="logList" class="flex-1 overflow-y-auto space-y-1 text-[11px] font-mono">
            <p class="opacity-20 italic">Initialisation système...</p>
        </div>
    </section>

    <div id="overlay" class="fixed inset-0 z-[100] hidden items-end justify-center bg-black/40 backdrop-blur-sm">
        <div id="drawer" class="status-drawer translate-y-full w-full p-10 rounded-t-[40px] text-center border-t-2 shadow-[0_-20px_50px_rgba(0,0,0,0.5)]">
            <div id="statusIcon" class="text-6xl mb-2"></div>
            <h2 id="statusTitle" class="font-cinema text-5xl uppercase italic leading-none mb-1"></h2>
            <p id="movieLabel" class="text-lg font-bold text-white uppercase tracking-tight"></p>
            <p id="ticketRef" class="text-[9px] opacity-40 font-mono mt-4"></p>
        </div>
    </div>

    <audio id="sndOk" src="https://assets.mixkit.co/active_storage/sfx/2869/2869-preview.mp3"></audio>
    <audio id="sndNo" src="https://assets.mixkit.co/active_storage/sfx/2571/2571-preview.mp3"></audio>

    <script>
        const API_URL = "https://sheetdb.io/api/v1/kdv8n5flmxfd9";
        let scanner;
        let count = 0;

        async function onScanSuccess(decodedText) {
            scanner.pause();
            const ov = document.getElementById('overlay');
            const dr = document.getElementById('drawer');
            const title = document.getElementById('statusTitle');
            const movie = document.getElementById('movieLabel');
            const icon = document.getElementById('statusIcon');
            const logs = document.getElementById('logList');

            try {
                const response = await fetch(`${API_URL}/search?ticket_id=${encodeURIComponent(decodedText)}`);
                const data = await response.json();

                ov.classList.remove('hidden');
                ov.classList.add('flex');
                setTimeout(() => dr.classList.remove('translate-y-full'), 20);

                if (data.length > 0 && data[0].status === "VALIDE") {
                    // RÉUSSITE
                    document.getElementById('sndOk').play();
                    if(navigator.vibrate) navigator.vibrate(200); // Vibration simple
                    
                    dr.className = "status-drawer w-full p-10 rounded-t-[40px] text-center border-t-2 bg-green-600 border-green-400";
                    title.innerText = "ACCÈS VALIDE";
                    movie.innerText = data[0].movie;
                    icon.innerText = "✅";
                    
                    // Historique
                    count++;
                    document.getElementById('counter').innerText = count;
                    const logEntry = document.createElement('div');
                    logEntry.className = "bg-green-500/10 text-green-500 p-2 rounded border-l-2 border-green-500 flex justify-between";
                    logEntry.innerHTML = `<span>OK: ${data[0].movie}</span><span>${new Date().toLocaleTimeString()}</span>`;
                    logs.prepend(logEntry);

                } else {
                    // ÉCHEC
                    document.getElementById('sndNo').play();
                    if(navigator.vibrate) navigator.vibrate([100, 50, 100]); // Triple vibration
                    
                    dr.className = "status-drawer w-full p-10 rounded-t-[40px] text-center border-t-2 bg-red-600 border-red-400";
                    title.innerText = "REFUSÉ";
                    movie.innerText = "BILLET INCONNU";
                    icon.innerText = "❌";

                    const logEntry = document.createElement('div');
                    logEntry.className = "bg-red-500/10 text-red-500 p-2 rounded border-l-2 border-red-500";
                    logEntry.innerText = `ERREUR: Ticket ${decodedText}`;
                    logs.prepend(logEntry);
                }
                document.getElementById('ticketRef').innerText = "ID: " + decodedText;

            } catch (err) {
                console.error(err);
                scanner.resume();
            }

            // Fermeture auto après 3 secondes
            setTimeout(() => {
                dr.classList.add('translate-y-full');
                setTimeout(() => { ov.classList.add('hidden'); ov.classList.remove('flex'); scanner.resume(); }, 400);
            }, 3000);
        }

        window.onload = () => {
            scanner = new Html5QrcodeScanner("reader", { fps: 60, qrbox: 250 });
            scanner.render(onScanSuccess);
        };
    </script>
</body>
</html>
