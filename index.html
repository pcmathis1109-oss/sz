<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>CinéScan TERMINAL</title>
    <script src="https://unpkg.com/html5-qrcode"></script>
    <style>
        :root { --matrix-green: #00ff41; --bg-black: #050505; }
        body { 
            font-family: 'Consolas', 'Courier New', monospace; 
            background-color: var(--bg-black); color: var(--matrix-green); 
            margin: 0; height: 100vh; display: flex; flex-direction: column; overflow: hidden;
        }

        /* Console du haut */
        #terminal-header { padding: 10px; border-bottom: 1px solid var(--matrix-green); font-size: 12px; background: #000; }
        
        /* Zone Scanner */
        .scan-zone { position: relative; flex-grow: 1; display: flex; align-items: center; justify-content: center; background: #000; }
        #reader { width: 300px; height: 300px; border: 1px solid var(--matrix-green); }
        .laser { position: absolute; width: 300px; height: 2px; background: var(--matrix-green); box-shadow: 0 0 15px var(--matrix-green); z-index: 10; animation: move 2s infinite linear; }
        @keyframes move { 0% { top: calc(50% - 150px); } 100% { top: calc(50% + 150px); } }

        /* Console de logs réels */
        #real-logs { 
            height: 150px; background: #000; border-top: 1px solid var(--matrix-green); 
            padding: 10px; font-size: 11px; overflow-y: auto; color: #00ff41;
        }
        .log-entry { margin-bottom: 3px; border-left: 3px solid var(--matrix-green); padding-left: 5px; }
        .timestamp { color: #888; margin-right: 10px; }

        /* Bouton */
        #init-btn { 
            position: absolute; z-index: 100; padding: 20px; background: var(--matrix-green); 
            color: black; border: none; font-weight: bold; cursor: pointer;
        }

        /* Alerte Succès Rapide */
        #flash { 
            position: fixed; top:0; left:0; width:100%; height:100%; 
            background: rgba(0,255,65,0.2); display:none; pointer-events: none; z-index: 200;
        }
    </style>
</head>
<body>

    <div id="terminal-header">
        [ SYSTEM VERSION 1.0.4 ]<br>
        [ STATUS: CONNECTED TO GOOGLE_API ]
    </div>

    <div class="scan-zone">
        <button id="init-btn">RUN CINEMATICKET.EXE</button>
        <div id="reader" style="display:none;"></div>
        <div id="laser-line" class="laser" style="display:none;"></div>
    </div>

    <div id="real-logs">
        <div class="log-entry">> Initialisation du noyau...</div>
    </div>

    <div id="flash"></div>

    <script>
        const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbxQv5Pj1rnhQcBaerKsWCYateY_ZP793WuDO1QfNaiaLP_IcODG9pkmh1O7-BQegjTu/exec";
        const logBox = document.getElementById('real-logs');

        function printLog(msg) {
            const now = new Date();
            const time = now.getHours() + ":" + now.getMinutes() + ":" + now.getSeconds();
            const div = document.createElement('div');
            div.className = "log-entry";
            div.innerHTML = `<span class="timestamp">[${time}]</span> ${msg}`;
            logBox.appendChild(div);
            logBox.scrollTop = logBox.scrollHeight;
        }

        document.getElementById('init-btn').addEventListener('click', async () => {
            document.getElementById('init-btn').style.display = 'none';
            document.getElementById('reader').style.display = 'block';
            document.getElementById('laser-line').style.display = 'block';
            
            printLog("Demande d'accès Hardware: CAMERA...");
            
            try {
                const html5QrCode = new Html5Qrcode("reader");
                await html5QrCode.start(
                    { facingMode: "environment" }, 
                    { fps: 20, qrbox: 250 },
                    (text) => executeTransfer(text)
                );
                printLog("Capteur optique : ONLINE");
            } catch (e) {
                printLog("ERREUR CRITIQUE: " + e);
            }
        });

        async function executeTransfer(ticketID) {
            printLog("PAQUET DÉTECTÉ: " + ticketID);
            
            // On flashe l'écran
            document.getElementById('flash').style.display = 'block';
            setTimeout(() => document.getElementById('flash').style.display = 'none', 200);

            if (navigator.vibrate) navigator.vibrate(50);

            printLog("REQUÊTE HTTP POST -> GOOGLE SHEETS...");
            
            const start = Date.now();
            
            try {
                // Ici c'est le VRAI envoi
                const response = await fetch(SCRIPT_URL + "?id=" + encodeURIComponent(ticketID));
                const end = Date.now();
                
                printLog(`TRANSMISSION RÉUSSIE (${end - start}ms)`);
                printLog(`DATABASE_UPDATE: SUCCESS`);
            } catch (err) {
                printLog("ERREUR RÉSEAU: ÉCHEC DE L'ENVOI");
            }
        }
    </script>
</body>
</html>
