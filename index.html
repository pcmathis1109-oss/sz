<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>CinéScan PRO</title>
    <script src="https://unpkg.com/html5-qrcode"></script>
    <style>
        :root { --primary: #ff3333; --bg: #0a0a0a; }
        body { 
            font-family: 'Segoe UI', Roboto, sans-serif; 
            background-color: var(--bg); color: white; margin: 0; 
            display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100vh; overflow: hidden;
        }

        /* Design En-tête */
        .header { position: absolute; top: 40px; text-align: center; width: 100%; z-index: 10; }
        .header h1 { font-size: 26px; letter-spacing: 3px; text-transform: uppercase; margin: 0; font-weight: 900; }
        .header span { color: var(--primary); }
        
        #status-container { margin-top: 10px; font-size: 13px; font-weight: 300; display: flex; align-items: center; justify-content: center; gap: 8px; }
        #status-dot { height: 10px; width: 10px; background-color: #444; border-radius: 50%; transition: 0.3s; box-shadow: 0 0 5px rgba(255,255,255,0.1); }

        /* Conteneur du Scanner */
        .scanner-container { position: relative; width: 85%; max-width: 380px; aspect-ratio: 1/1; border-radius: 30px; border: 1px solid rgba(255,255,255,0.1); background: #000; overflow: hidden; box-shadow: 0 20px 50px rgba(0,0,0,0.5); }
        #reader { width: 100% !important; border: none !important; }
        #reader video { object-fit: cover !important; }

        /* Viseur Style Cinéma */
        .corner { position: absolute; width: 35px; height: 35px; border: 4px solid var(--primary); z-index: 20; }
        .top-left { top: 20px; left: 20px; border-right: none; border-bottom: none; border-top-left-radius: 15px; }
        .top-right { top: 20px; right: 20px; border-left: none; border-bottom: none; border-top-right-radius: 15px; }
        .bottom-left { bottom: 20px; left: 20px; border-right: none; border-top: none; border-bottom-left-radius: 15px; }
        .bottom-right { bottom: 20px; right: 20px; border-left: none; border-top: none; border-bottom-right-radius: 15px; }

        .scan-line {
            position: absolute; width: 100%; height: 4px; background: linear-gradient(to bottom, transparent, var(--primary));
            box-shadow: 0 0 20px var(--primary); top: 0; z-index: 15; animation: scan 2s ease-in-out infinite;
        }
        @keyframes scan { 0% { top: 10%; } 50% { top: 90%; } 100% { top: 10%; } }

        /* Bouton Action */
        #start-btn {
            background: var(--primary); color: white; border: none; padding: 20px 60px;
            font-size: 16px; font-weight: bold; border-radius: 15px; cursor: pointer;
            box-shadow: 0 10px 30px rgba(255, 51, 51, 0.4); z-index: 100; text-transform: uppercase; letter-spacing: 1px;
        }
        #start-btn:active { transform: scale(0.98); }

        #result-text { position: absolute; bottom: 60px; font-size: 14px; color: #888; width: 80%; text-align: center; font-style: italic; }
    </style>
</head>
<body>

    <div class="header">
        <h1>CINÉ<span>SCAN</span> PRO</h1>
        <div id="status-container"><span id="status-dot"></span> <span id="status-text">PRÊT POUR CONTRÔLE</span></div>
    </div>

    <button id="start-btn">Démarrer le Scan</button>

    <div class="scanner-container" id="scanner-box" style="display:none;">
        <div id="reader"></div>
        <div class="scan-line"></div>
        <div class="corner top-left"></div>
        <div class="corner top-right"></div>
        <div class="corner bottom-left"></div>
        <div class="corner bottom-right"></div>
    </div>

    <div id="result-text">Veuillez scanner un ticket VIP</div>

    <script>
        const startBtn = document.getElementById('start-btn');
        const scannerBox = document.getElementById('scanner-box');
        const statusDot = document.getElementById('status-dot');
        const statusText = document.getElementById('status-text');
        const resultText = document.getElementById('result-text');

        // TON LIEN GOOGLE SHEETS DÉJÀ INTÉGRÉ
        const GOOGLE_SCRIPT_URL = "https://script.google.com/macros/s/AKfycbxQv5Pj1rnhQcBaerKsWCYateY_ZP793WuDO1QfNaiaLP_IcODG9pkmh1O7-BQegjTu/exec"; 

        async function startScanner() {
            try {
                // Demande autorisation caméra
                await navigator.mediaDevices.getUserMedia({ video: { facingMode: "environment" } });
                
                startBtn.style.display = 'none';
                scannerBox.style.display = 'block';

                const html5QrCode = new Html5Qrcode("reader");
                const config = { fps: 25, qrbox: { width: 250, height: 250 } };

                await html5QrCode.start(
                    { facingMode: "environment" }, 
                    config,
                    (decodedText) => {
                        handleScan(decodedText);
                    }
                );
            } catch (err) {
                alert("Erreur Caméra : Assurez-vous d'être en HTTPS et d'autoriser l'accès.");
            }
        }

        function handleScan(ticketID) {
            // Vibration (uniquement Android)
            if (navigator.vibrate) navigator.vibrate(200);
            
            statusDot.style.backgroundColor = "#f39c12";
            statusText.innerText = "VÉRIFICATION...";
            resultText.innerText = "Lecture : " + ticketID;

            // Envoi des données vers Google Sheets
            fetch(GOOGLE_SCRIPT_URL + "?id=" + encodeURIComponent(ticketID))
                .then(() => {
                    statusDot.style.backgroundColor = "#2ecc71";
                    statusDot.style.boxShadow = "0 0 15px #2ecc71";
                    statusText.innerText = "TICKET ACCEPTÉ";
                    resultText.innerText = "ID " + ticketID + " enregistré.";
                    
                    // Réinitialisation après 2 secondes pour le prochain ticket
                    setTimeout(() => {
                        statusDot.style.backgroundColor = "#444";
                        statusDot.style.boxShadow = "none";
                        statusText.innerText = "PRÊT POUR CONTRÔLE";
                    }, 2500);
                })
                .catch(() => {
                    statusDot.style.backgroundColor = "#ff3333";
                    statusText.innerText = "ERREUR RÉSEAU";
                    alert("Problème de connexion au tableau Sheets.");
                });
        }

        startBtn.addEventListener('click', startScanner);
    </script>
</body>
</html>
