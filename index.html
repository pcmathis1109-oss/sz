<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>TERMINAL CINÉSCAN</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/html5-qrcode"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;800&display=swap');
        body { font-family: 'JetBrains Mono', monospace; background: #000; color: #0f0; height: 100vh; overflow: hidden; }
        .scanner-line { position: absolute; top:0; width: 100%; height: 2px; background: #ff0000; box-shadow: 0 0 15px #ff0000; animation: scan 2s linear infinite; z-index: 50; }
        @keyframes scan { 0% { top: 0% } 100% { top: 100% } }
        #reader__dashboard { display: none !important; }
        #reader video { object-fit: cover !important; filter: contrast(1.5) grayscale(1); }
    </style>
</head>
<body class="flex flex-col p-6">
    <div class="flex justify-between items-start mb-8">
        <div class="border-l-4 border-red-600 pl-4">
            <h1 class="text-xl font-black text-white leading-none">CinéScan <span class="text-red-600">ULTRA</span></h1>
            <p class="text-[8px] opacity-50 uppercase tracking-[.3em]">Status: System_Active</p>
        </div>
        <div class="text-right text-[10px]">
            <div id="clock" class="font-bold text-white">00:00:00</div>
            <div class="text-green-500 underline uppercase tracking-tighter">Live API Connected</div>
        </div>
    </div>

    <div class="relative w-full aspect-square max-w-[350px] mx-auto border border-white/10 rounded-3xl overflow-hidden bg-zinc-900 shadow-[0_0_50px_rgba(0,0,0,1)]">
        <div class="scanner-line"></div>
        <div id="reader" class="w-full h-full"></div>
    </div>

    <div id="movieBox" class="mt-8 bg-white/5 border border-white/10 p-6 rounded-2xl hidden animate-pulse">
        <p class="text-[8px] text-red-600 font-bold mb-1 uppercase">Film Détecté :</p>
        <h2 id="movieTitle" class="text-2xl font-black text-white uppercase italic leading-tight"></h2>
        <div class="mt-4 flex gap-2">
            <span class="text-[9px] bg-green-600/20 text-green-400 px-2 py-1 rounded border border-green-600/30 font-bold uppercase">Ticket Valide</span>
            <span class="text-[9px] bg-white/10 text-white px-2 py-1 rounded font-bold uppercase">Entrée Autorisée</span>
        </div>
    </div>

    <audio id="sndOk" src="https://assets.mixkit.co/active_storage/sfx/2869/2869-preview.mp3"></audio>
    <audio id="sndError" src="https://assets.mixkit.co/active_storage/sfx/2571/2571-preview.mp3"></audio>

    <script>
        const API_URL = "https://sheetdb.io/api/v1/ffd07sknkm202";
        let qrcode;

        function updateClock() {
            document.getElementById('clock').innerText = new Date().toLocaleTimeString();
        }
        setInterval(updateClock, 1000);

        async function onScanSuccess(id) {
            qrcode.pause();
            const box = document.getElementById('movieBox');
            const title = document.getElementById('movieTitle');
            
            try {
                const res = await fetch(`${API_URL}/search?ticket_id=${encodeURIComponent(id)}`);
                const data = await res.json();

                if (data.length > 0 && data[0].status === "VALIDE") {
                    document.getElementById('sndOk').play();
                    title.innerText = data[0].movie;
                    box.classList.remove('hidden');
                    // Vibration téléphone
                    if(navigator.vibrate) navigator.vibrate(100);
                } else {
                    document.getElementById('sndError').play();
                    alert("ALERTE : TICKET INVALIDE !");
                }
            } catch (e) { alert("Erreur réseau"); }

            setTimeout(() => {
                box.classList.add('hidden');
                qrcode.resume();
            }, 5000);
        }

        window.onload = () => {
            qrcode = new Html5QrcodeScanner("reader", { fps: 60, qrbox: 250 });
            qrcode.render(onScanSuccess);
        }
    </script>
</body>
</html>
