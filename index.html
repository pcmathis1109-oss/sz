<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CinéScan VIP - Scanner</title>
    <script src="https://unpkg.com/html5-qrcode"></script>
    <style>
        body { font-family: sans-serif; text-align: center; background: #1a1a1a; color: white; padding: 20px; }
        #reader { width: 100%; max-width: 500px; margin: auto; border: 2px solid #e74c3c; border-radius: 10px; overflow: hidden; background: black; }
        button { background: #e74c3c; color: white; border: none; padding: 15px 30px; font-size: 18px; border-radius: 5px; cursor: pointer; margin-top: 20px; }
        #status-dot { height: 15px; width: 15px; background-color: #bbb; border-radius: 50%; display: inline-block; margin-right: 10px; }
        .success { color: #2ecc71; }
        .error { color: #e74c3c; }
    </style>
</head>
<body>

    <h2>🎥 CinéScan VIP</h2>
    <div id="status-container">
        <span id="status-dot"></span> Connexion Google Sheets
    </div>

    <button id="start-btn">ACTIVER LA CAMÉRA</button>

    <div id="reader" style="display:none;"></div>
    <div id="result"></div>

    <script>
        const startBtn = document.getElementById('start-btn');
        const readerDiv = document.getElementById('reader');
        const statusDot = document.getElementById('status-dot');

        // 1. Fonction qui demande l'accès à la caméra
        async function initScanner() {
            try {
                // Force la demande d'autorisation au navigateur
                const stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: "environment" } });
                
                // Si autorisé, on cache le bouton et on montre le scanner
                startBtn.style.display = 'none';
                readerDiv.style.display = 'block';

                const html5QrCode = new Html5Qrcode("reader");
                
                const qrCodeSuccessCallback = (decodedText, decodedResult) => {
                    alert("Ticket Scanné : " + decodedText);
                    // Ici, on envoie la donnée à ton Google Sheets
                    sendDataToSheets(decodedText);
                };

                const config = { fps: 10, qrbox: { width: 250, height: 250 } };
                
                // Démarre la caméra arrière
                await html5QrCode.start({ facingMode: "environment" }, config, qrCodeSuccessCallback);

            } catch (err) {
                console.error("Erreur Caméra: ", err);
                alert("Erreur : Vous devez autoriser la caméra dans les réglages de votre navigateur.");
            }
        }

        // 2. Envoi des données vers ton script Google Sheets
        function sendDataToSheets(id) {
            // REMPLACE PAR TON URL GOOGLE APPS SCRIPT
            const scriptURL = "TON_URL_GOOGLE_APPS_SCRIPT_ICI"; 
            
            fetch(scriptURL + "?id=" + id)
                .then(response => {
                    statusDot.style.backgroundColor = "#2ecc71";
                    alert("✅ Ticket validé dans Google Sheets !");
                })
                .catch(error => {
                    statusDot.style.backgroundColor = "#e74c3c";
                    console.error('Erreur Sheets:', error);
                });
        }

        // Écouteur sur le bouton
        startBtn.addEventListener('click', initScanner);

        // Test automatique au chargement (certains navigateurs l'acceptent)
        window.onload = () => {
            navigator.permissions.query({name: 'camera'}).then(res => {
                if(res.state === 'granted') initScanner();
            });
        };
    </script>
</body>
</html>
