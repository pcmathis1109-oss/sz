<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Scanner de Contrôle Ciné</title>
    <script src="https://unpkg.com/html5-qrcode"></script>
    <style>
        :root { --main-blue: #007aff; --success: #28a745; --terminal-green: #00ff41; --dark-bg: #121212; }
        
        body { 
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: #000; color: white; margin: 0; display: flex; flex-direction: column; height: 100vh;
        }

        /* Barre d'état du contrôleur */
        .top-bar {
            background: var(--dark-bg); padding: 15px; border-bottom: 1px solid #333;
            display: flex; justify-content: space-between; align-items: center;
        }
        .status-badge { background: #222; padding: 5px 10px; border-radius: 5px; font-size: 12px; border: 1px solid #444; }
        .dot { height: 8px; width: 8px; background: orange; border-radius: 50%; display: inline-block; margin-right: 5px; }

        /* Zone de visée */
        .scan-area { flex-grow: 1; position: relative; display: flex; align-items: center; justify-content: center; }
        #reader { width: 80%; max-width: 320px; border-radius: 20px; overflow: hidden; border: 2px solid #333; }
        
        /* Bouton Start */
        #init-btn { 
            position: absolute; padding: 20px 40px; background: var(--main-blue); 
            color: white; border: none; border-radius: 10px; font-weight: bold; font-size: 16px;
        }

        /* CONSOLE TECHNIQUE (Le code en bas) */
        .terminal {
            background: #000; height: 180px; border-top: 1px solid #333;
            font-family: 'Consolas', 'Monaco', monospace; font-size: 11px;
            padding: 10px; overflow-y: auto; color: var(--terminal-green);
        }
        .line { margin-bottom: 4px; border-left: 2px solid #222; padding-left: 8px; }
        .time { color: #666; font-size: 9px; margin-right: 5px; }
        .cmd { color: #fff; }

        /* Overlay de succès */
        #success-pop {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(40, 167, 69, 0.9); display: none;
            flex-direction: column; align-items: center; justify-content: center; z-index: 1000;
        }
    </style>
</head>
<body>

    <div class="top-bar">
        <div><strong>CONTRÔLE ACCÈS</strong></div>
        <div class="status-badge"><span id="dot-status" class="dot"></span> <span id="text-status">PRÊT</span></div>
    </div>

    <div class="scan-area">
        <button id="init-btn">LANCER LE SCANNER</button>
        <div id="reader" style="display:none;"></div>
    </div>

    <div class="terminal" id="term-box">
        <div class="line"><span class="time">18:45:01</span> [SYSTEM] Kernel CinéScan initialized.</div>
        <div class="line"><span class="time">18:45:02</span> [NET] Waiting for hardware...</div>
    </div>

    <div id="success-pop">
        <h1 style="font-size: 50px;">✅</h1>
        <h2>TICKET VALIDE</h2>
    </div>

    <script>
        const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbxQv5Pj1rnhQcBaerKsWCYateY_ZP793WuDO1QfNaiaLP_IcODG9pkmh1O7-BQegjTu/exec";
        const term = document.getElementById('term-box');

        function addTerminalLine(msg, isCode = false) {
            const now = new Date();
            const time = now.toLocaleTimeString();
            const div = document.createElement('div');
            div.className = "line";
            div.innerHTML = `<span class="time">${time}</span> ${isCode ? '<span class="cmd">' + msg + '</span>' : msg}`;
            term.appendChild(div);
            term.scrollTop = term.scrollHeight;
        }

        document.getElementById('init-btn').addEventListener('click', async () => {
            document.getElementById('init-btn').style.display = 'none';
            document.getElementById('reader').style.display = 'block';
            addTerminalLine("GET /dev/camera0 HTTP/1.1", true);
            
            try {
                const scanner = new Html5Qrcode("reader");
                await scanner.start({ facingMode: "environment" }, { fps: 20, qrbox: 250 }, (text) => processTicket(text));
                addTerminalLine("CAMERA_STATE: ACTIVE_SUCCESS");
                document.getElementById('dot-status').style.background = "#2ecc71";
                document.getElementById('text-status').innerText = "EN LIGNE";
            } catch (e) {
                addTerminalLine("FATAL_ERROR: " + e, true);
            }
        });

        async function processTicket(id) {
            if (navigator.vibrate) navigator.vibrate(100);
            
            addTerminalLine(`SCAN_EVENT: ID_RAW="${id}"`, true);
            addTerminalLine(`POST /api/sheets/v4/append?id=${id}`, true);
            
            document.getElementById('dot-status').style.background = "orange";
            const start = Date.now();

            try {
                const response = await fetch(SCRIPT_URL + "?id=" + encodeURIComponent(id));
                const delay = Date.now() - start;
                
                addTerminalLine(`HTTP_RESPONSE: 200 OK (${delay}ms)`, true);
                addTerminalLine(`JSON_RESULT: {"status":"written", "id":"${id}"}`, true);

                // Affichage succès pro
                document.getElementById('success-pop').style.display = 'flex';
                setTimeout(() => { 
                    document.getElementById('success-pop').style.display = 'none';
                    document.getElementById('dot-status').style.background = "#2ecc71";
                }, 1200);

            } catch (err) {
                addTerminalLine("NET_ERROR: Connection timed out", true);
            }
        }
    </script>
</body>
</html>
