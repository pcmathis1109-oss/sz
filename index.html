<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>CinéScan Terminal Pro</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/html5-qrcode"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@700;900&display=swap');
        
        body { background: #000; color: #fff; font-family: ui-sans-serif, system-ui; height: 100vh; overflow: hidden; display: flex; flex-direction: column; }
        .font-cinema { font-family: 'Barlow Condensed', sans-serif; }

        /* Scanner Styling */
        #reader { border: none !important; }
        #reader video { object-fit: cover !important; border-radius: 20px; }
        #reader__dashboard { display: none !important; }
        
        /* Laser Animation */
        .laser-line {
            position: absolute; width: 100%; height: 3px; background: #ff0000;
            box-shadow: 0 0 15px #ff0000; z-index: 50; animation: scanMove 2s infinite alternate;
        }
        @keyframes scanMove { from { top: 0% } to { top: 100% } }

        .status-drawer { transition: transform 0.4s cubic-bezier(0.4, 0, 0.2, 1); }
    </style>
</head>
<body class="bg-black text-white">

    <header class="p-6 bg-zinc-900 border-b border-white/10 flex justify-between items-center">
        <div>
            <h1 class="font-cinema text-3xl tracking-tighter leading-none">TERMINAL <span class="text-red-600">KDV-8</span></h1>
            <p class="text-[10px] font-bold opacity-40 uppercase tracking-widest">Contrôle d'Accès Sécurisé</p>
        </div>
        <div class="bg-black/40 px-4 py-2 rounded border border-white/5 text-right">
            <p class="text-[9px] opacity-50 uppercase font-bold">Entrées</p>
            <p id="counter" class="text-xl font-bold text-red-500">0</p>
        </div>
    </header>

    <main class="flex-1 relative bg-black flex items-center justify-center">
        <div class="relative w-72 h-72 border-2 border-white/20 rounded-3xl overflow-hidden shadow-[0_0_50px_rgba(255,0,0,0.2)]">
            <div class="laser-line"></div>
            <div id="reader" class="w-full h-full"></div>
        </div>
        <div class="absolute inset-0 pointer-events-none border-[30px] border-black/60"></div>
    </main>

    <section class="h-40 bg-zinc-950 p-4 border-t border-white/10 flex flex-col">
        <h2 class="text-[9px] font-black text-zinc-600 uppercase tracking-[0.3em] mb-2">Logs Terminal</h2>
        <div id="logList" class="flex-1 overflow-y-auto space-y-2 text-[11px] font-mono">
            <p class="opacity-30 italic">Scanner prêt. En attente de détection...</p>
        </div>
    </section>

    <div id="overlay" class="fixed inset-0 z-[100] hidden items-end justify-center bg-black/60 backdrop-blur-md">
        <div id="drawer" class="status-drawer translate-y-full w-full p-12 rounded-t-[50px] text-center border-t-2 shadow-[0_-20px_60px_rgba(0,0,0,0.8)]">
            <div id="statusIcon" class="text-7xl mb-4 animate-bounce"></div>
            <h2 id="statusTitle" class="font-cinema text-5xl uppercase italic leading-none mb-2"></h2>
            <p id="movieLabel" class="text-xl font-bold text-white uppercase tracking-tight"></p>
            <p id="ticketRef" class="text-[10px] opacity-40 font-mono mt-6"></p>
        </div>
    </div>

    <audio id="sndOk" src="https://assets.mixkit.co/active_storage/sfx/2869/2869-preview.mp3"></audio>
    <audio id="sndNo" src="https://assets.mixkit.co/active_storage/sfx/2571/2571-preview.mp3"></audio>

    <script>
        const API_URL = "https://sheetdb.io/api/v1/kdv8n5flmxfd9";
        let scanner;
        let count = 0;

        async function onScanSuccess(decodedText) {
            scanner.pause();
            const ov = document.getElementById('overlay');
            const dr = document.getElementById('drawer');
            const title = document.getElementById('statusTitle');
            const movie = document.getElementById('movieLabel');
            const icon = document.getElementById('statusIcon');
            const logs = document.getElementById('logList');

            try {
                // 1. RECHERCHE DU TICKET
                const response = await fetch(`${API_URL}/search?ticket_id=${encodeURIComponent(decodedText)}`);
                const data = await response.json();

                ov.classList.remove('hidden');
                ov.classList.add('flex');
                setTimeout(() => dr.classList.remove('translate-y-full'), 20);

                if (data.length > 0 && data[0].status === "VALIDE") {
                    
                    // 2. MISE À JOUR ANTI-FRAUDE (Désactive le ticket)
                    await fetch(`${API_URL}/ticket_id/${decodedText}`, {
                        method: 'PATCH',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ "status": "UTILISÉ" })
                    });

                    document.getElementById('sndOk').play();
                    if(navigator.vibrate) navigator.vibrate(200);
                    
                    dr.className = "status-drawer w-full p-12 rounded-t-[50px] text-center border-t-2 bg-emerald-600 border-emerald-400";
                    title.innerText = "ACCÈS ACCORDÉ";
                    movie.innerText = data[0].movie;
                    icon.innerText = "✅";
                    
                    count++;
                    document.getElementById('counter').innerText = count;
                    addLog(`OK: ${decodedText} (${data[0].movie})`, "text-emerald-500");

                } else if (data.length > 0 && data[0].status === "UTILISÉ") {
                    // TICKET DÉJÀ SCANNE
                    document.getElementById('sndNo').play();
                    if(navigator.vibrate) navigator.vibrate([300, 100, 300]); 
                    
                    dr.className = "status-drawer w-full p-12 rounded-t-[50px] text-center border-t-2 bg-orange-600 border-orange-400";
                    title.innerText = "DÉJÀ UTILISÉ";
                    movie.innerText = "FRAUDE DÉTECTÉE";
                    icon.innerText = "⚠️";
                    addLog(`ALERTE: Ticket ${decodedText} déjà utilisé !`, "text-orange-500 font-bold");

                } else {
                    // TICKET INCONNU
                    document.getElementById('sndNo').play();
                    if(navigator.vibrate) navigator.vibrate([100, 100, 100, 100]); 

                    dr.className = "status-drawer w-full p-12 rounded-t-[50px] text-center border-t-2 bg-red-700 border-red-500";
                    title.innerText = "REFUSÉ";
                    movie.innerText = "TICKET NON RECONNU";
                    icon.innerText = "❌";
                    addLog(`ERREUR: Code inconnu scanné`, "text-red-500");
                }
                document.getElementById('ticketRef').innerText = "RÉFÉRENCE : " + decodedText;

            } catch (err) {
                console.error("Erreur API:", err);
                addLog("ERREUR RÉSEAU", "text-red-500");
                scanner.resume();
            }

            // Fermeture après 4 secondes
            setTimeout(() => {
                dr.classList.add('translate-y-full');
                setTimeout(() => { ov.classList.add('hidden'); ov.classList.remove('flex'); scanner.resume(); }, 400);
            }, 4000);
        }

        function addLog(msg, colorClass) {
            const logs = document.getElementById('logList');
            const entry = document.createElement('div');
            entry.className = `p-2 rounded bg-white/5 border-l-2 ${colorClass} flex justify-between`;
            entry.innerHTML = `<span>${msg}</span><span class="opacity-40">${new Date().toLocaleTimeString()}</span>`;
            logs.prepend(entry);
        }

        window.onload = () => {
            scanner = new Html5QrcodeScanner("reader", { fps: 60, qrbox: 250 });
            scanner.render(onScanSuccess);
        };
    </script>
</body>
</html>
