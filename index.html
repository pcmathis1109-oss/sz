<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>CinéScan Terminal</title>
    <link rel="manifest" href="manifest.json">
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/html5-qrcode"></script>
    <style>
        body { background: #000; color: #fff; font-family: system-ui, sans-serif; height: 100vh; display: flex; flex-col; overflow: hidden; }
        #reader video { object-fit: cover !important; }
        #reader__dashboard { display: none !important; }
        .drawer { transition: transform 0.4s cubic-bezier(0.4, 0, 0.2, 1); }
    </style>
</head>
<body class="flex flex-col">

    <header class="p-5 bg-zinc-900 border-b border-white/10 flex justify-between items-center">
        <div>
            <h1 class="font-black text-lg tracking-tighter uppercase">Terminal <span class="text-red-600">Pro</span></h1>
            <p class="text-[9px] opacity-40 font-bold uppercase">Entrées : <span id="counter" class="text-white">0</span></p>
        </div>
        <div class="flex gap-2">
            <button onclick="toggleSettings()" class="bg-zinc-800 p-2 rounded-lg text-[10px] font-bold border border-white/5 uppercase">⚙️ Menu</button>
        </div>
    </header>

    <div class="relative flex-1 bg-black overflow-hidden">
        <div id="reader" class="w-full h-full"></div>
        <div class="absolute inset-0 pointer-events-none flex items-center justify-center">
            <div class="w-64 h-64 border-2 border-red-600/30 rounded-3xl"></div>
        </div>
    </div>

    <div class="h-40 bg-zinc-950 border-t border-white/10 p-4">
        <p class="text-[8px] font-black opacity-30 uppercase mb-3 tracking-widest">Journal des scans</p>
        <div id="history" class="space-y-2 overflow-y-auto h-24">
            <p id="noData" class="text-[10px] opacity-20 italic text-center mt-4">Aucun scan en mémoire</p>
        </div>
    </div>

    <div id="overlay" class="fixed inset-0 z-[100] hidden items-end justify-center">
        <div id="statusCard" class="drawer translate-y-full w-full p-10 rounded-t-[40px] text-center border-t-2">
            <h2 id="statusTitle" class="text-4xl font-black uppercase italic mb-2"></h2>
            <p id="movieName" class="text-xl font-bold text-white uppercase"></p>
        </div>
    </div>

    <div id="settings" class="fixed inset-0 z-[200] bg-black p-8 hidden flex-col">
        <div class="flex justify-between items-center mb-10">
            <h2 class="text-2xl font-black uppercase">Outils</h2>
            <button onclick="toggleSettings()" class="text-4xl">&times;</button>
        </div>
        <button onclick="localStorage.clear(); location.reload();" class="w-full p-4 bg-red-600/20 text-red-500 rounded-xl font-bold uppercase text-xs border border-red-500/20">Vider la mémoire du terminal</button>
    </div>

    <audio id="sndOk" src="https://assets.mixkit.co/active_storage/sfx/2869/2869-preview.mp3"></audio>
    <audio id="sndNo" src="https://assets.mixkit.co/active_storage/sfx/2571/2571-preview.mp3"></audio>

    <script>
        const API_URL = "https://sheetdb.io/api/v1/ffd07sknkm202";
        let html5Qr;
        let count = 0;

        function toggleSettings() {
            const s = document.getElementById('settings');
            s.classList.toggle('hidden'); s.classList.toggle('flex');
        }

        async function onScan(id) {
            html5Qr.pause();
            const ov = document.getElementById('overlay');
            const card = document.getElementById('statusCard');
            
            try {
                const res = await fetch(`${API_URL}/search?ticket_id=${encodeURIComponent(id)}`);
                const data = await res.json();
                
                ov.classList.remove('hidden');
                ov.classList.add('flex');
                setTimeout(() => card.classList.remove('translate-y-full'), 10);

                if (data.length > 0 && data[0].status === "VALIDE") {
                    document.getElementById('sndOk').play();
                    card.className = "drawer w-full p-10 rounded-t-[40px] text-center border-t-2 bg-green-600 border-green-400";
                    document.getElementById('statusTitle').innerText = "AUTORISÉ";
                    document.getElementById('movieName').innerText = data[0].movie;
                    
                    // Ajout à l'historique réel
                    document.getElementById('noData')?.remove();
                    const log = document.createElement('div');
                    log.className = "flex justify-between bg-white/5 p-2 rounded text-[10px] border-l-2 border-green-500";
                    log.innerHTML = `<span>${data[0].movie}</span><span class="opacity-30">${new Date().toLocaleTimeString()}</span>`;
                    document.getElementById('history').prepend(log);
                    count++;
                    document.getElementById('counter').innerText = count;
                } else {
                    document.getElementById('sndNo').play();
                    card.className = "drawer w-full p-10 rounded-t-[40px] text-center border-t-2 bg-red-600 border-red-400";
                    document.getElementById('statusTitle').innerText = "REFUSÉ";
                    document.getElementById('movieName').innerText = "TICKET INVALIDE";
                }
            } catch (e) { html5Qr.resume(); }

            setTimeout(() => {
                card.classList.add('translate-y-full');
                setTimeout(() => { ov.classList.add('hidden'); ov.classList.remove('flex'); html5Qr.resume(); }, 400);
            }, 3000);
        }

        window.onload = () => {
            html5Qr = new Html5QrcodeScanner("reader", { fps: 60, qrbox: 250 });
            html5Qr.render(onScan);
        };
    </script>
</body>
</html>
