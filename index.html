<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>CinéScan ULTIMATE</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/html5-qrcode"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&display=swap');
        body { font-family: 'Orbitron', sans-serif; background: #000; color: #fff; overflow: hidden; height: 100vh; }
        
        /* Scanner Laser */
        .laser-line {
            position: absolute; width: 100%; height: 3px; background: rgba(255, 0, 0, 0.8);
            box-shadow: 0 0 15px 5px rgba(255, 0, 0, 0.5); z-index: 10;
            animation: scanMove 2.5s linear infinite;
        }
        @keyframes scanMove { 0% { top: 0%; } 100% { top: 100%; } }

        /* Masquage des éléments inutiles de la librairie */
        #reader__dashboard { display: none !important; }
        #reader video { object-fit: cover !important; filter: sepia(1) hue-rotate(-50deg) brightness(1.2); }
        
        .log-entry { border-left: 2px solid #ef4444; animation: slideIn 0.3s ease-out; }
        @keyframes slideIn { from { opacity: 0; transform: translateX(-10px); } to { opacity: 1; transform: translateX(0); } }
    </style>
</head>
<body class="flex flex-col">

    <div class="p-6 flex justify-between items-start z-50 bg-gradient-to-b from-black to-transparent">
        <div>
            <h1 class="text-xl font-black tracking-tighter text-red-600">TERMINAL <span class="text-white">v4.0</span></h1>
            <p id="status-text" class="text-[8px] text-green-500 font-bold uppercase tracking-[0.3em] animate-pulse">Système Online</p>
        </div>
        <div class="text-right">
            <div id="clock" class="text-lg font-bold">00:00:00</div>
            <div class="text-[7px] opacity-50 uppercase">Auth: Admin_Root</div>
        </div>
    </div>

    <main class="flex-1 relative flex flex-col items-center justify-center px-6">
        <div class="relative w-full aspect-square max-w-[320px]">
            <div class="absolute -top-2 -left-2 w-10 h-10 border-t-4 border-l-4 border-red-600 z-20"></div>
            <div class="absolute -top-2 -right-2 w-10 h-10 border-t-4 border-r-4 border-red-600 z-20"></div>
            <div class="absolute -bottom-2 -left-2 w-10 h-10 border-b-4 border-l-4 border-red-600 z-20"></div>
            <div class="absolute -bottom-2 -right-2 w-10 h-10 border-b-4 border-r-4 border-red-600 z-20"></div>
            
            <div id="reader" class="w-full h-full rounded-sm overflow-hidden bg-zinc-900 border border-white/5 relative">
                <div class="laser-line"></div>
            </div>
        </div>

        <div id="info-box" class="mt-8 w-full max-w-[320px] bg-white/5 border border-white/10 p-4 rounded-lg hidden">
            <p class="text-[8px] uppercase text-red-500 font-bold mb-1">Dernière Détection :</p>
            <h2 id="detected-movie" class="text-lg font-black uppercase truncate">---</h2>
        </div>
    </main>

    <div class="h-32 bg-zinc-950 border-t border-white/10 p-4 overflow-y-auto">
        <div class="text-[8px] text-gray-500 uppercase font-bold mb-2">Historique des flux :</div>
        <div id="scan-logs" class="space-y-2 text-[10px] font-mono">
            <div class="text-gray-600 italic">[SYSTEM] Initialisation du scanner...</div>
        </div>
    </div>

    <div id="overlay" class="fixed inset-0 z-[100] flex items-center justify-center hidden backdrop-blur-md">
        <div id="card" class="w-4/5 p-8 rounded-2xl border-4 flex flex-col items-center text-center transform transition-all duration-300 scale-50">
            <div id="icon" class="text-6xl mb-4"></div>
            <h2 id="msg" class="text-3xl font-black italic mb-2"></h2>
            <p id="movie" class="text-sm font-bold opacity-80 uppercase"></p>
        </div>
    </div>

    <audio id="s-ok" src="https://assets.mixkit.co/active_storage/sfx/2869/2869-preview.mp3"></audio>
    <audio id="s-no" src="https://assets.mixkit.co/active_storage/sfx/2571/2571-preview.mp3"></audio>

    <script>
        const API_URL = "https://sheetdb.io/api/v1/ffd07sknkm202";
        let html5Qr;

        function updateClock() {
            const now = new Date();
            document.getElementById('clock').innerText = now.toLocaleTimeString();
        }
        setInterval(updateClock, 1000);

        function addLog(msg, type) {
            const logs = document.getElementById('scan-logs');
            const color = type === 'ok' ? 'text-green-400' : 'text-red-500';
            const entry = document.createElement('div');
            entry.className = "log-entry pl-2 " + color;
            entry.innerText = `[${new Date().toLocaleTimeString()}] ${msg}`;
            logs.prepend(entry);
        }

        async function onScan(id) {
            html5Qr.pause();
            const ov = document.getElementById('overlay');
            const cr = document.getElementById('card');
            
            try {
                const res = await fetch(`${API_URL}/search?ticket_id=${encodeURIComponent(id)}`);
                const data = await res.json();
                
                ov.classList.remove('hidden');
                setTimeout(() => cr.classList.remove('scale-50'), 50);

                if (data.length > 0 && data[0].status === "VALIDE") {
                    document.getElementById('s-ok').play();
                    cr.className = "w-4/5 p-8 rounded-2xl border-4 bg-green-900/80 border-green-400 text-green-400";
                    document.getElementById('msg').innerText = "VALIDE";
                    document.getElementById('movie').innerText = data[0].movie;
                    document.getElementById('icon').innerText = "✓";
                    document.getElementById('detected-movie').innerText = data[0].movie;
                    document.getElementById('info-box').classList.remove('hidden');
                    addLog("ACCÈS AUTORISÉ : " + data[0].movie, 'ok');
                } else {
                    document.getElementById('s-no').play();
                    cr.className = "w-4/5 p-8 rounded-2xl border-4 bg-red-900/80 border-red-500 text-red-500";
                    document.getElementById('msg').innerText = "REFUSÉ";
                    document.getElementById('movie').innerText = "TICKET INCONNU";
                    document.getElementById('icon').innerText = "✕";
                    addLog("ALERTE : TICKET INVALIDE DÉTECTÉ", 'no');
                }
            } catch (e) { html5Qr.resume(); }

            setTimeout(() => {
                ov.classList.add('hidden');
                cr.classList.add('scale-50');
                html5Qr.resume();
            }, 3000);
        }

        window.onload = () => {
            html5Qr = new Html5QrcodeScanner("reader", { fps: 30, qrbox: 250 });
            html5Qr.render(onScan);
            addLog("Scanner prêt. En attente de détection...", 'ok');
        };
    </script>
</body>
</html>
