<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>CinéScan ULTIMATE</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/html5-qrcode"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@400;900&display=swap');
        
        body { font-family: 'Orbitron', sans-serif; background: #000; overflow: hidden; }
        
        /* Animation du laser de scan */
        @keyframes scan-moving { 0% { top: 0% } 100% { top: 100% } }
        .laser { animation: scan-moving 2s linear infinite; background: linear-gradient(to bottom, transparent, #ff0000, transparent); height: 4px; position: absolute; width: 100%; z-index: 30; box-shadow: 0 0 15px #ff0000; }

        /* Effet de grille sur l'écran */
        .grid-overlay { background-image: radial-gradient(circle, #ffffff10 1px, transparent 1px); background-size: 20px 20px; }
        
        #reader__dashboard { display: none !important; }
        #reader video { object-fit: cover !important; filter: contrast(1.2) brightness(1.1); }
        
        .status-pulse { animation: pulse 1.5s infinite; }
        @keyframes pulse { 0% { opacity: 1; } 50% { opacity: 0.3; } 100% { opacity: 1; } }
    </style>
</head>
<body class="text-white h-screen flex flex-col">

    <div class="fixed inset-0 pointer-events-none z-40 border-[20px] border-white/5"></div>

    <header class="p-8 flex justify-between items-start z-50">
        <div>
            <div class="flex items-center gap-2 mb-1">
                <span class="w-3 h-3 bg-red-600 rounded-full status-pulse"></span>
                <h1 class="text-xl font-black tracking-[0.3em] uppercase">CinéScan <span class="text-red-600">PRO</span></h1>
            </div>
            <p class="text-[9px] text-gray-500 uppercase tracking-widest font-bold">Terminal ID : CS-892-X</p>
        </div>
        <div class="text-right">
            <div id="clock" class="text-sm font-bold text-red-600 mb-1"></div>
            <div class="text-[8px] text-green-500 border border-green-500/30 px-2 py-0.5 rounded-full bg-green-500/5">SYNC : LIVE CLOUD</div>
        </div>
    </header>

    <main class="flex-1 relative flex items-center justify-center">
        <div class="relative w-72 h-72">
            <div class="absolute -top-4 -left-4 w-12 h-12 border-t-2 border-l-2 border-red-600 z-50"></div>
            <div class="absolute -top-4 -right-4 w-12 h-12 border-t-2 border-r-2 border-red-600 z-50"></div>
            <div class="absolute -bottom-4 -left-4 w-12 h-12 border-b-2 border-l-2 border-red-600 z-50"></div>
            <div class="absolute -bottom-4 -right-4 w-12 h-12 border-b-2 border-r-2 border-red-600 z-50"></div>
            
            <div id="reader" class="w-full h-full rounded-2xl overflow-hidden grayscale contrast-125 bg-zinc-900 border border-white/10 relative">
                <div class="laser"></div>
            </div>
        </div>
    </main>

    <div id="resultOverlay" class="fixed inset-0 z-[100] hidden flex flex-col items-center justify-center backdrop-blur-md">
        <div id="resultCard" class="w-[85%] max-w-sm p-8 rounded-3xl border-2 transition-transform duration-500 scale-90">
            <div class="text-[10px] uppercase tracking-widest font-bold mb-4 opacity-50">Résultat du contrôle</div>
            <h2 id="resultTitle" class="text-4xl font-black italic mb-2"></h2>
            <div class="h-px bg-white/20 my-6"></div>
            <div class="space-y-4">
                <div>
                    <p class="text-[8px] uppercase opacity-50">Film identifié</p>
                    <p id="resultMovie" class="text-lg font-bold uppercase"></p>
                </div>
                <div>
                    <p class="text-[8px] uppercase opacity-50">Ticket ID</p>
                    <p id="resultId" class="text-xs font-mono"></p>
                </div>
            </div>
        </div>
    </div>

    <audio id="sndOk" src="https://assets.mixkit.co/active_storage/sfx/2869/2869-preview.mp3"></audio>
    <audio id="sndNo" src="https://assets.mixkit.co/active_storage/sfx/2571/2571-preview.mp3"></audio>

    <script>
        const API_URL = "https://sheetdb.io/api/v1/ffd07sknkm202";
        let scanner;

        // Horloge temps réel
        setInterval(() => {
            const now = new Date();
            document.getElementById('clock').innerText = now.getHours().toString().padStart(2, '0') + ":" + now.getMinutes().toString().padStart(2, '0') + ":" + now.getSeconds().toString().padStart(2, '0');
        }, 1000);

        async function handleScan(decodedText) {
            scanner.pause();
            const overlay = document.getElementById('resultOverlay');
            const card = document.getElementById('resultCard');
            
            try {
                const response = await fetch(`${API_URL}/search?ticket_id=${encodeURIComponent(decodedText)}`);
                const data = await response.json();

                overlay.classList.remove('hidden');
                setTimeout(() => card.classList.remove('scale-90'), 50);

                if (data.length > 0 && data[0].status === "VALIDE") {
                    // SUCCÈS
                    card.className = "w-[85%] max-w-sm p-8 rounded-3xl border-2 bg-green-950/90 border-green-400 text-green-400 shadow-[0_0_50px_rgba(34,197,94,0.3)]";
                    document.getElementById('resultTitle').innerText = "AUTORISÉ";
                    document.getElementById('resultMovie').innerText = data[0].movie;
                    document.getElementById('resultId').innerText = decodedText;
                    document.getElementById('sndOk').play();
                } else {
                    // ÉCHEC
                    card.className = "w-[85%] max-w-sm p-8 rounded-3xl border-2 bg-red-950/90 border-red-500 text-red-500 shadow-[0_0_50px_rgba(239,68,68,0.3)]";
                    document.getElementById('resultTitle').innerText = "REFUSÉ";
                    document.getElementById('resultMovie').innerText = "BILLET INCONNU";
                    document.getElementById('resultId').innerText = "INVALID_HASH";
                    document.getElementById('sndNo').play();
                }
            } catch (e) { scanner.resume(); }

            setTimeout(() => {
                overlay.classList.add('hidden');
                card.classList.add('scale-90');
                scanner.resume();
            }, 4000);
        }

        window.onload = () => {
            scanner = new Html5QrcodeScanner("reader", { fps: 60, qrbox: 250 });
            scanner.render(handleScan);
        };
    </script>
</body>
</html>
